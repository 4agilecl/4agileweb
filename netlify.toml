[build]
  command = "pnpm build"
  publish = "dist/public"

[[redirects]]
  from = "/servicios"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/nosotros"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/contacto"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/gracias"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/404"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/"
  status = 301

[build.environment]
  NODE_VERSION = "22"
